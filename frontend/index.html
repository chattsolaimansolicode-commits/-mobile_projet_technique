]<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Estate Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">
    <div class="max-w-3xl mx-auto p-4 md:p-6">
        <h1 class="text-3xl font-bold mb-6">
            Real Estate Portal
        </h1>

        <button
            id="show-form"
            class="bg-red-600 text-white px-4 py-2 rounded-lg mb-4 w-full sm:w-auto"
        >
            Ajouter un bien
        </button>

        <form id="form" class="hidden bg-red p-4 rounded-lg shadow-sm mb-6">
            <input
                type="text"
                id="name"
                placeholder="Nom du bien"
                class="border p-2 rounded w-full mb-3"
                required
            >

            <textarea
                id="description"
                placeholder="Description du bien"
                class="border p-2 rounded w-full mb-3"
                required
            ></textarea>

            <button
                id="submit-btn"
                type="submit"
                class="bg-green-600 text-white px-4 py-2 rounded-lg w-full sm:w-auto disabled:opacity-50"
            >
                Enregistrer
            </button>
        </form>

        <ul id="list" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></ul>
    </div>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-4 right-4 left-4 sm:left-auto"></div>

    <script src="app.js"></script>
</body>
</html>
